# Vault Ease of Maintenance — Example Configuration
# Copy this file to config.yaml. Edit the values for your environment.
# Do not commit config.yaml. It can contain your real API key.
#
# This file is a FALLBACK layer, not the source of truth. Resolution order:
#   code defaults <- <pluginDir>/config.yaml <- Settings tab (MAIN)
# The Obsidian Settings tab (data.json) is the MAIN config and always wins.
# Plugin-store users have no config.yaml at all — they configure the
# Settings tab only.
# There is deliberately NO vault-level config file: vaults may be shared
# (company-wide databases) and must not carry API keys or parameters.
# Embedding dimensions come from `embedding.dimensions` — never inferred
# from the model name.
#
# Key resolution order: config.yaml -> plugin settings -> env var.
# Environment variables: OMLX_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY.

vault_path: /path/to/your/vault   # informational. The plugin uses the vault you open.
db_path: ""                       # informational. Derived as {vault}/.note-maintainer/index.db.
inbox_folder: ""                  # folder to sort. Empty = auto-discover.
ignore_patterns: ""               # one glob per line. Skips matching files and folders.

api:
  base_url: http://127.0.0.1:8000/v1   # local endpoint. Or https://openrouter.ai/api/v1
  api_key: ""                          # optional. Falls back to an environment variable.

manifest:
  filename: _manifest.md               # manifest file name.

embedding:
  model: embeddinggemma-300m-8bit      # model for embeddings.
  dimensions: 768                      # dimension count — match the model (embeddinggemma-300m-8bit = 768).

agent:
  model: gemma-4-31b-it-4bit           # model for clean, sort, and chat.

# Per-feature reasoning gate (chat/build/sort toggle independently).
# Reasoning models (gemma-4-31b-it) think before answering. Default OFF
# (measured: no quality gain for sort/build on local hardware) — turn a
# feature ON only where quality justifies the latency.
thinking:
  chat: false
  build: false
  sort: false

# Chat tool-calling is AUTO-DETECTED (one probe call at startup, cached per
# model): models that can't emit tool calls automatically get the retrieval
# fallback mode (deterministic note search + grounded answer). No config needed.
# Generated data (index, pending reviews, chat sessions) lives in the vault
# under .note-maintainer/ — add that one line to your vault's .gitignore.
# The Settings tab (data.json inside .obsidian/) is the MAIN config; if the
# vault is committed/shared, ignore data.json and keep secrets in this file.

preview:
  enabled: true                        # false = write immediately.
  ttl_minutes: 30                      # pending reviews older than this are swept.

query:
  top_k: 5                             # results returned to chat / clean / sort.
  depth: 1                             # BFS levels past the resolved seeds (hybrid search).
  max_fan_out: 8                       # max outgoing edges followed per key per level.
  max_seeds: 8                         # max resolver seeds to expand from.
  top_reports: 3                       # max community reports grounding the global-mode
                                       # answer (overview questions, Phase 4). Higher =
                                       # broader overview, more LLM tokens per question.

# Graph-build tuning — shapes the stored EDGES + COMMUNITIES. Highest-impact
# knobs on GraphRAG behavior; deliberately NOT in the Settings tab.
#   cluster_threshold: higher = fewer, larger auto-communities (drives
#     Phase-4 report granularity).
#   inferred_threshold: higher = leaner EDGES table (fewer cosine-derived edges).
#   inferred_max_edges_per_section: cap on inferred edges per section.
graph:
  cluster_threshold: 0.5
  inferred_threshold: 0.7
  inferred_max_edges_per_section: 3

# Community-report tuning — the build-side LLM report pass (Phase 4).
# Deliberately NOT in the Settings tab (advanced tuning).
#   context_cap_tokens: per-community token budget for the member-section
#     context a report is generated from. Higher = richer reports (better
#     global-mode answers), more LLM tokens per build. Sections beyond the
#     cap are dropped in node_key order.
reports:
  context_cap_tokens: 3000

# LLM entity-extraction tuning — the build-side semantic-graph pass
# (Phase 5): typed entities + relationships become semantic EDGES, queried
# through the hybrid search's traversal. Deliberately NOT in the Settings
# tab (advanced tuning).
#   context_cap_tokens: token budget per extraction LLM call — also the
#     per-file cap. Files are batched greedily under this budget; higher =
#     fewer LLM calls per build (richer context), more tokens per call.
extraction:
  context_cap_tokens: 3000

index:
  warn_mb: 256                # warning threshold for the index file size (MB). sql.js
                              # holds ~10× the file size in RAM while building — warn
                              # before silent memory surprises on large vaults.
